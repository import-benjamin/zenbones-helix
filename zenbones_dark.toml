# Language-leaning tweaks (Rust, Python, etc.)
"keyword.storage" = { fg = "magenta" }         # e.g. let, const
"keyword.type" = { fg = "cyan" }               # e.g. struct, enum, class
"keyword.exception" = { fg = "light-red" }     # e.g. try/except
"keyword.import" = { fg = "light-magenta" }    # use, import, from
"keyword.repeat" = { fg = "magenta" }          # for, while
"keyword.conditional" = { fg = "magenta" }     # if, match

"variable.global" = { fg = "light-yellow" }
"variable.static" = { fg = "light-yellow" }
"variable.readonly" = { fg = "light-yellow" }

"function.special" = { fg = "light-red" }

